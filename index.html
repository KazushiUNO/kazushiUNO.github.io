
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kazushi Uno</title>

  <link rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background:
        radial-gradient(circle at top left, rgba(0, 140, 255, 0.15), transparent 30%),
        radial-gradient(circle at bottom right, rgba(0, 140, 255, 0.12), transparent 30%),
        #0a0f1c;

      color: white;
      font-family: "Segoe UI", sans-serif;
      min-height: 100vh;
      padding-top: 120px;
      overflow-x: hidden;
    }

    /* 背景グリッド */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px);
      background-size: 40px 40px;
      z-index: -2;
    }

    /* 上部バー */
    .header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 25px 50px;

      background: rgba(10, 15, 28, 0.85);
      backdrop-filter: blur(12px);

      border-bottom: 1px solid rgba(255,255,255,0.08);

      z-index: 1000;
    }

    .header h1 {
      font-size: 32px;
      letter-spacing: 2px;
      font-weight: 700;

      background: linear-gradient(90deg, #ffffff, #4da3ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* メインカード */
    .card {
      width: 90%;
      max-width: 1100px;

      margin: auto;

      display: flex;
      align-items: center;
      gap: 60px;

      padding: 50px;

      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);

      border-radius: 28px;

      box-shadow:
        0 0 30px rgba(0,140,255,0.15),
        0 10px 40px rgba(0,0,0,0.4);

      backdrop-filter: blur(15px);

      position: relative;
      overflow: hidden;
    }

    /* 青い光 */
    .card::before {
      content: "";
      position: absolute;
      width: 300px;
      height: 300px;
      background: rgba(0,140,255,0.18);
      border-radius: 50%;
      top: -120px;
      right: -120px;
      filter: blur(60px);
    }

    .profile-image {
      width: 320px;
      height: 240px;
      object-fit: cover;

      border-radius: 20px;

      border: 2px solid rgba(77,163,255,0.5);

      box-shadow:
        0 0 25px rgba(0,140,255,0.4),
        0 0 60px rgba(0,140,255,0.15);

      transition: 0.4s;
    }

    .profile-image:hover {
      transform: scale(1.03);
    }

    .content {
      flex: 1;
      position: relative;
      z-index: 2;
    }

    .name {
      font-size: 52px;
      font-weight: 700;
      margin-bottom: 45px;
      letter-spacing: 1px;

      color: white;
    }

    .section-title {
      font-size: 30px;
      color: #4da3ff;

      margin-bottom: 20px;

      display: inline-block;
      position: relative;
    }

    .section-title::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: -8px;
      width: 100%;
      height: 3px;

      background: linear-gradient(90deg, #4da3ff, transparent);
      border-radius: 10px;
    }

    .profile-text {
      font-size: 20px;
      line-height: 2;
      color: rgba(255,255,255,0.88);

      margin-top: 15px;
    }

    /* アイコン */
    .links {
      margin-top: 35px;
      display: flex;
      align-items: center;
      gap: 25px;
      flex-wrap: wrap;
    }

    .link-btn {
      display: inline-flex;
      align-items: center;
      gap: 12px;

      padding: 14px 24px;

      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(77,163,255,0.25);

      border-radius: 14px;

      color: white;
      text-decoration: none;
      font-size: 20px;

      transition: 0.3s;
    }

    .link-btn:hover {
      background: rgba(77,163,255,0.15);
      transform: translateY(-3px);
      box-shadow: 0 0 20px rgba(77,163,255,0.3);
    }

    .github-icon {
      font-size: 40px;
      color: white;
      transition: 0.3s;
    }

    .github-icon:hover {
      color: #4da3ff;
      transform: scale(1.1);
    }

    /* レスポンシブ */
    @media (max-width: 900px) {
      .card {
        flex-direction: column;
        text-align: center;
        padding: 40px 30px;
      }

      .profile-image {
        width: 100%;
        max-width: 360px;
        height: auto;
      }

      .links {
        justify-content: center;
      }

      .name {
        font-size: 42px;
      }
    }
  </style>
</head>

<body>

  <header class="header">
    <h1>Kazushi Uno</h1>
  </header>

  <div class="card">

    <img
      src="uno.jpg"
      class="profile-image"
    >

    <div class="content">

      <p class="name">
        Kazushi Uno
      </p>

      <h2 class="section-title">
        Profile
      </h2>

      <p class="profile-text">
        愛知工業大学 3年 情報科学部<br>
        コンピュータシステム専攻<br>
        自然言語処理研究室所属
      </p>

      <div class="links">

        <a href="mailto:k24029kk@aitech.ac.jp" class="link-btn">
          <i class="fa-solid fa-envelope"></i>
          Mail
        </a>

        <a href="https://github.com/KazushiUno">
          <i class="fa-brands fa-github github-icon"></i>
        </a>

      </div>

    </div>

  </div>

</body>
</html>
